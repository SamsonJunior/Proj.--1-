<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — EDC Tailoring Showcase</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Cormorant+Garamond:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="page">
  <div id="nav-mount"></div>
  <main class="main">
    <div class="container">
      <div class="form-card">
        <span class="eyebrow" style="text-align:center">Account recovery</span>
        <h2 class="text-center">Reset your password</h2>
        <p class="muted" style="text-align:center;margin-top:-8px;font-size:0.9em;">
          Enter the email and full name on your account, then choose a new password.
        </p>
        <div id="alert-mount"></div>
        <form id="reset-form">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="full_name">Full name on account</label>
            <input id="full_name" name="full_name" type="text" required placeholder="Exactly as you registered it">
          </div>
          <div class="field">
            <label for="new_password">New password</label>
            <input id="new_password" name="new_password" type="password" required minlength="6" autocomplete="new-password">
          </div>
          <div class="field">
            <label for="confirm_password">Confirm new password</label>
            <input id="confirm_password" name="confirm_password" type="password" required minlength="6" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Reset password</button>
        </form>
        <div class="form-foot"><a href="/login.html">Back to log in</a></div>
      </div>
    </div>
  </main>
  <footer class="footer"><div class="container">Web-Based Tailoring Showcase &amp; Client-Linkage System — NSUK EDC</div></footer>
</div>
<script src="/js/common.js"></script>
<script>
renderNav();
document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  const alertMount = document.getElementById('alert-mount');
  alertMount.innerHTML = '';

  const newPassword = form.get('new_password');
  const confirmPassword = form.get('confirm_password');
  if (newPassword !== confirmPassword) {
    alertMount.innerHTML = `<div class="alert alert-error">Passwords do not match.</div>`;
    return;
  }

  try {
    await api.send('POST', '/api/forgot-password', {
      email: form.get('email'),
      full_name: form.get('full_name'),
      new_password: newPassword,
    });
    alertMount.innerHTML = `<div class="alert alert-success">Password updated. You can log in now.</div>`;
    e.target.reset();
    setTimeout(() => { window.location.href = '/login.html'; }, 1500);
  } catch (err) {
    alertMount.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
  }
});
</script>
</body>
</html>
